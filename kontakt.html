<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontakt - Vektor Studio</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <script src="kontaktvalidering.js" defer></script>
</head>

<body>
    <header>
        <img src="logo.png" alt="Vektor Studio logotyp">
        <input type="checkbox" id="menu-toggle">
        <label for="menu-toggle" id="menuIcon">&#9776;</label>
        <ul id="menu">
            <li><a href="index.html">Hem</a></li>
            <li><a href="konsulter.html">Konsulter</a></li>
            <li><a href="kontakt.html">Kontakt</a></li>
        </ul>
    </header>

    <h1>Kontakta oss</h1>

    <div class="contact-container">
        <div class="contact-info">
            <h2>Hitta oss</h2>
            <p>Vektor Studio</p>
            <p>Örebro</p>
            <p>Vardagar 09-17</p>
            <p>info@vektorstudio.se</p>
        </div>

        <form class="contact-form">
            <label for="name">Namn (obligatoriskt)</label>
            <input type="text" id="name" class="field">
            <p class="validation-text" id="nameValidation"></p>

            <label for="phone">Telefonnummer (obligatoriskt)</label>
            <input type="text" id="phone" class="field">
            <p class="validation-text" id="phoneValidation"></p>

            <label for="email">E-postadress (obligatoriskt)</label>
            <input type="text" id="email" class="field">
            <p class="validation-text" id="emailValidation"></p>

            <label for="message">Meddelande (obligatoriskt)</label>
            <textarea id="message" class="field"></textarea>
            <p class="validation-text" id="messageValidation"></p>

            <button type="button" id="sendButton" class="button blue-button">Skicka</button>
            <p class="validation-text" id="sendResult"></p>
        </form>
    </div>
</body>

</html>
